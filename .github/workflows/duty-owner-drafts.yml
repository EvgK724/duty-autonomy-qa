name: Isolated synthetic duty QA
run-name: "Owner duty dispatch ${{ inputs.dispatch_key || 'manual-qa' }}"
on:
  workflow_dispatch:
    inputs:
      dispatch_key:
        description: Synthetic correlation only; never a real approval ID
        required: false
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: isolated-duty-qa-main
  cancel-in-progress: false
jobs:
  build:
    if: github.repository == 'EvgK724/duty-autonomy-qa' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Validate correlation input without executing it
        env:
          DISPATCH_KEY: ${{ inputs.dispatch_key }}
        run: python -c 'import os,re; assert re.fullmatch("[a-f0-9]{32}|", os.environ["DISPATCH_KEY"])'
      - name: Install pinned PDF dependencies
        run: python -m pip install -r dezhurstva/tools/pdf-requirements.txt
      - name: Build and verify isolated fixed synthetic fixture
        run: python -B dezhurstva/tools/owner_bridge/runner.py
      - name: Commit only verified synthetic artifacts
        run: |
          git add -- dezhurstva/data dezhurstva/files dezhurstva/cal dezhurstva/index.html
          python - <<'PY'
          import subprocess,re
          paths=subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines()
          pattern=r'dezhurstva/(index\.html|data/(schedule|publication-receipts)\.json|files/(2099-01(-print)?\.pdf|2099-01\.xlsx|pdf\.json|hashes\.json)|cal/(all|synthetic_a|synthetic_b)\.ics)'
          assert all(re.fullmatch(pattern,p) for p in paths), 'UNEXPECTED_DIFF'
          subprocess.run(['git','diff','--exit-code','--','.github','dezhurstva/tools','qa/approved-fixture.json'],check=True)
          PY
          if ! git diff --cached --quiet; then
            git -c user.name='Synthetic QA bot' -c user.email='qa@example.invalid' commit -m 'Publish fixed synthetic QA artifacts'
            git push origin HEAD:main
          fi
      - name: Upload only generated stateless QA site
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: _site
  deploy:
    needs: build
    if: github.repository == 'EvgK724/duty-autonomy-qa' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy only this repository's synthetic Pages artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
